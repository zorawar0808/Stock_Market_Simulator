[project]
name = "esummit-market-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic==1.13.2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.20",
    "websockets==13.1",
    "vercel-queue==0.7.1",
]

[tool.uv]
package = false

[[tool.vercel.subscribers]]
entrypoint = "worker.market_tick"
